<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Private Edge-AI</title>
    
    <link rel="stylesheet" href="/static/css/main.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="logo">Lumina</h2>
                <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
            </div>
            
            <div id="chat-list" class="history-container">
                <p class="history-label">Recent Conversations</p>
                </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <span id="current-mode">Model: Llama 3 (Local)</span>
            </header>

            <div id="chat-box" class="chat-display">
                <div class="msg ai">
                    <b>Lumina:</b> 
                    <p>Welcome back! I'm running locally on your hardware. How can I assist you in this new session?</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" id="user-input" 
                           placeholder="Message Lumina..." 
                           onkeypress="handleKey(event)" 
                           autocomplete="off">
                    
                    <button onclick="sendMessage()" id="send-btn" title="Send Message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
                <p class="footer-note">Lumina is an AI assistant. Verify important information.</p>
            </div>
        </main>
        
    </div>

    <script src="/static/js/chat.js"></script>

</body>
</html>
